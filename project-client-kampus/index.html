<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Katalog Mahasiswa</title>
    <link rel="stylesheet" href="./style.css" />
</head>

<body>
    <h1>Katalog Data Mahasiswa</h1>
    <div class="kartu" style="max-width: 600px; margin: 0 auto 20px auto; display: flex; gap: 10px; padding: 15px;">
        <input type="text" id="input-cari" placeholder="Cari nama mahasiswa..." style="flex: 1; padding: 10px; border-radius: 5px; border: 1px solid #ccc;">
        <button onclick="cariMahasiswa()" style="background-color: #17a2b8; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer;">
            Cari
        </button>
        <button onclick="resetPencarian()" style="background-color: #6c757d; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer;">
            Reset
        </button>
    </div>
    <button class="btn-refresh" onclick="ambilDataMahasiswa()">
        Refresh Data
    </button>
    <p id="pesan-status"></p>
    <div class="kartu form-container"
        style="max-width: 500px; margin: 0 auto 30px auto; border-top: 4px solid #28a745;">
        <h3> Tambah Mahasiswa Baru</h3>
        <form id="form-tambah" onsubmit="tambahMahasiswa(event)">
            <div style="margin-bottom: 10px">
                <label for="input-nim">NIM:</label><br />
                <input type="text" id="input-nim" required style="width: 100%; padding: 8px" />
            </div>
            <div style="margin-bottom: 10px">
                <label for="input-nama">Nama Lengkap:</label><br />
                <input type="text" id="input-nama" required style="width: 100%; padding: 8px" />
            </div>
            <div style="margin-bottom: 10px">
                <label for="input-jurusan">Jurusan:</label><br />
                <input type="text" id="input-jurusan" value="Teknik Informatika" required
                    style="width: 100%; padding: 8px" />
            </div>
            <div style="margin-bottom: 10px">
                <label for="input-angkatan">Angkatan (Tahun):</label><br />
                <input type="number" id="input-angkatan" required style="width: 100%; padding: 8px" />
            </div>
            <button type="submit"
                style="background-color: #007bff; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; width:100%;">
                Simpan Data
            </button>
        </form>
    </div>
    <div id="container-edit" class="kartu"
        style="max-width: 500px; margin: 0 auto 30px auto; border-top: 4px solid #ffc107; display: none;">
        <h3> Edit Data Mahasiswa</h3>
        <form id="form-edit" onsubmit="simpanUpdate(event)">
            <div style="margin-bottom: 10px;">
                <label for="edit-nim">NIM (Tidak bisa diubah):</label><br>
                <input type="text" id="edit-nim" readonly style="width: 100%; padding: 8px; background-color: #eee;">
            </div>
            <div style="margin-bottom: 10px;">
                <label for="edit-nama">Nama Lengkap:</label><br>
                <input type="text" id="edit-nama" required style="width: 100%; padding: 8px;">
            </div>
            <div style="margin-bottom: 10px;">
                <label for="edit-jurusan">Jurusan:</label><br>
                <input type="text" id="edit-jurusan" required style="width: 100%; padding: 8px;">
            </div>
            <div style="margin-bottom: 10px;">
                <label for="edit-angkatan">Angkatan (Tahun):</label><br>
                <input type="number" id="edit-angkatan" required style="width: 100%; padding: 8px;">
            </div>
            <button type="submit"
                style="background-color: #ffc107; color: #333; font-weight: bold; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; width: 100%;">
                Simpan Perubahan
            </button>
            <button type="button" onclick="batalEdit()"
                style="background-color: #6c757d; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; width: 100%; margin-top: 10px;">
                Batal
            </button>
        </form>
    </div>
    <div id="wadah-kartu" class="container-kartu"></div>
    <script src="./script.js"></script>
</body>

</html>
